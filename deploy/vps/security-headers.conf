# Included in every location that sets its own headers (nginx drops server-level add_header there).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(self)" always;
# Enforced: no framing, no plugins, no <base> tricks.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
# Full policy in report-only mode first, so a missed payment-provider domain shows in the browser
# console instead of breaking checkout. Enforce it once a live Paystack and Flutterwave payment is clean.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.paystack.co https://checkout.flutterwave.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://paystack.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src https://*.paystack.co https://*.paystack.com https://*.flutterwave.com https://*.f4b-flutterwave.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
