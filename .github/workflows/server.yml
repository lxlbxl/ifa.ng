name: server

on:
  push:
    paths: ["server/**", "db/**", "deploy/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "db/**", "deploy/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrations apply on a clean plain Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run migrate
      - name: Web app data path through a real PostgREST
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          DATA_JWT_SECRET: ci-only-data-secret-0123456789abcdef0123
          POSTGREST_URL: http://localhost:3000
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE ROLE ifa_rest LOGIN NOINHERIT PASSWORD 'rest'"
          npm run migrate
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://ifa_rest:rest@localhost:5432/postgres \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$DATA_JWT_SECRET" -e PGRST_JWT_AUD=authenticated \
            -e PGRST_DB_CHANNEL_ENABLED=true -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.12
          npm run test:e2e
      - name: PostgREST log
        if: failure()
        run: docker logs postgrest || true
