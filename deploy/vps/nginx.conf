server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 # Ebo proof videos can be up to 300 MB.
 client_max_body_size 310m;
 server_tokens off;

 include /etc/nginx/snippets/security-headers.conf;

 location /rest/v1/ {
  proxy_pass http://postgrest:3000/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
 }
 location ~ ^/(api/|v1/|webhooks/|files/|health$) {
  proxy_pass http://api:8787;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  # Pass Traefik's X-Forwarded-For through unchanged, so the visitor's IP stays the last entry.
  # (Appending here would put Traefik's own address last and make every visitor look the same
  # to the login rate limits.)
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_buffering off;
  proxy_request_buffering on;
  proxy_read_timeout 300s;
 }
 # Hashed build files never change: cache for a year.
 location /assets/ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
 }
 location = /sw.js { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
 location = /manifest.webmanifest { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
 location = /index.html { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; }
}
