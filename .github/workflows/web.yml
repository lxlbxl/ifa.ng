name: web

on:
  push:
    paths-ignore: ["server/**", "workers/**", "deploy/**", "db/**", "**/*.md"]
  pull_request:
    paths-ignore: ["server/**", "workers/**", "deploy/**", "db/**", "**/*.md"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
