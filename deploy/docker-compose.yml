# IFA.ng production stack for a single self-managed VPS.
#   cd deploy && cp .env.example .env && (edit .env) && docker compose up -d --build
# Postgres is never published to the internet: only Caddy listens publicly.
name: ifa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ifa
      POSTGRES_USER: ifa_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?set in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set in .env}
      REST_DB_PASSWORD: ${REST_DB_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/01-api-role.sh:/docker-entrypoint-initdb.d/01-api-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifa_admin -d ifa"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://ifa_api:${API_DB_PASSWORD}@db:5432/ifa
      MIGRATE_DATABASE_URL: postgres://ifa_admin:${DB_ADMIN_PASSWORD}@db:5432/ifa
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env}
      PORT: "8787"
      NODE_ENV: production
      API_URL: https://${API_DOMAIN}
      APP_URL: ${APP_URL:?set in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      DATA_JWT_SECRET: ${DATA_JWT_SECRET:?set in .env}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-IFA.ng <no-reply@ifa.ng>}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      FLW_SECRET_KEY: ${FLW_SECRET_KEY:-}
      FLW_PUBLIC_KEY: ${FLW_PUBLIC_KEY:-}
      FLW_SECRET_HASH: ${FLW_SECRET_HASH:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_ORGANIZER_EMAIL: ${GOOGLE_ORGANIZER_EMAIL:-}
      AGORA_APP_ID: ${AGORA_APP_ID:-}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-IFA}
      TERMII_BASE_URL: ${TERMII_BASE_URL:-https://api.ng.termii.com}
      GEO_COUNTRY_HEADER: ${GEO_COUNTRY_HEADER:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@ifa.ng}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      FILES_DIR: /data/files
    volumes:
      - files:/data/files

  # Turns Meet recordings (or uploaded audio) into transcripts and draft notes.
  recorder:
    build:
      context: ../workers/recording-processor
    restart: unless-stopped
    depends_on: [api]
    environment:
      DATABASE_URL: postgres://ifa_api:${API_DB_PASSWORD}@db:5432/ifa
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      FILES_DIR: /data/files
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_ORGANIZER_EMAIL: ${GOOGLE_ORGANIZER_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - files:/data/files

  # Table reads and writes from the web app, under the same row-level security rules
  # the app was built on. Served at https://API_DOMAIN/rest/v1 through Caddy.
  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://ifa_rest:${REST_DB_PASSWORD}@db:5432/ifa
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${DATA_JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_OPENAPI_MODE: disabled
      PGRST_SERVER_PORT: "3000"
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      PGRST_DB_CHANNEL_ENABLED: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, postgrest]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGDATABASE: ifa
      PGUSER: ifa_admin
      PGPASSWORD: ${DB_ADMIN_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./backups:/backups

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
